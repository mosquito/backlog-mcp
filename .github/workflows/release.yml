name: release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: node --test tests/webui_client.mjs

      - name: Set version from tag
        run: uv version "${GITHUB_REF_NAME#v}"

      - run: uv sync --all-groups
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -v --cov=backlog_mcp --cov-report=term-missing

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          uv version "$VERSION"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Validate the chart
        run: |
          set -euo pipefail
          helm lint charts/backlog-mcp --set image.digest="$IMAGE_DIGEST"
          helm template backlog-mcp charts/backlog-mcp --set image.digest="$IMAGE_DIGEST" >/dev/null
          if helm template backlog-mcp charts/backlog-mcp --set image.digest=md5:abcd >/dev/null 2>&1; then
            echo "The chart accepted an unsupported application digest" >&2
            exit 1
          fi
          if helm template backlog-mcp charts/backlog-mcp \
            --set image.digest="$IMAGE_DIGEST" \
            --set test.image.digest=sha256:1 >/dev/null 2>&1; then
            echo "The chart accepted a malformed test-image digest" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/mosquito/backlog-mcp
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/mosquito/backlog-mcp
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-platform release image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=backlog-mcp-multiplatform
          cache-to: type=gha,mode=max,scope=backlog-mcp-multiplatform
          provenance: mode=max
          sbom: true

      - name: Package the chart with the published image digest
        env:
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          digest = os.environ["RELEASE_IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("The published image must have a valid SHA-256 index digest")
          path = Path("charts/backlog-mcp/values.yaml")
          values = path.read_text()
          placeholder = '  digest: ""'
          if values.count(placeholder) != 1:
              raise SystemExit("Expected exactly one application image digest placeholder")
          path.write_text(values.replace(placeholder, f'  digest: "{digest}"'))
          PY
          helm lint charts/backlog-mcp
          helm package charts/backlog-mcp \
            --version "$RELEASE_VERSION" \
            --app-version "$RELEASE_VERSION" \
            --destination "$RUNNER_TEMP"
          helm template backlog "$RUNNER_TEMP/backlog-mcp-${RELEASE_VERSION}.tgz" \
            > "$RUNNER_TEMP/backlog-manifests.yaml"
          grep -F "ghcr.io/mosquito/backlog-mcp@$RELEASE_IMAGE_DIGEST" \
            "$RUNNER_TEMP/backlog-manifests.yaml"

      - name: Push the OCI chart
        env:
          HELM_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$HELM_REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/backlog-mcp-${RELEASE_VERSION}.tgz" oci://ghcr.io/mosquito/charts

      - name: Attach the chart to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$RUNNER_TEMP/backlog-mcp-${RELEASE_VERSION}.tgz"
          --clobber
          --repo "$GITHUB_REPOSITORY"
