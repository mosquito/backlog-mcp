[project]
name = "backlog-mcp"
version = "0.15.3"
description = "A project backlog over MCP: projects scoped to directories, tasks scoped to projects"
readme = "README.md"
authors = [
    { name = "Dmitry Orlov", email = "orlovdl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp-tiny-mcp[jwt]~=0.5.3",
    "aiosql>=15.0",
    "aiosqlite>=0.21.0",
    "argclass>=1.11.0",
    "model2vec>=0.9.0",
    "numpy>=2.0",
    "rich>=15.0.0",
    "rtoml>=0.13.0",
]

[project.scripts]
backlog = "backlog_mcp.cli:main"
backlog-mcp = "backlog_mcp.cli:server_main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "markdown-pytest>=0.6.6",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "RET", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
# Benchmark data: long literal rows and model identifiers.
"benchmarks/**" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# The registry decorators in aiohttp-tiny-mcp are unannotated; the handlers below them are not.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["argclass"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests", "README.md"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
