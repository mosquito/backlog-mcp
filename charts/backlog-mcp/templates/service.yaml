apiVersion: v1
kind: Service
metadata:
  name: {{ include "backlog-mcp.fullname" . | quote }}
  labels:
    {{- include "backlog-mcp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ include "backlog-mcp.intRange" (list .Values.service.port "service.port" 1 65535) }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "backlog-mcp.selectorLabels" . | nindent 4 }}
