<!doctype html>
<html lang="en" data-endpoint="{{ENDPOINT}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Backlog</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/ui/static/app.css" />
    <script type="module" src="/ui/static/app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/ui/">Backlog<span class="brand-dot">.</span></a
      ><span id="project-name"></span
      ><button id="search-open" class="quiet">Search <kbd>⌘ K</kbd></button
      ><a href="/ui/static/connect.html" class="button primary connect-agent">Connect agent</a
      ><span id="principal"></span><button id="logout" class="quiet" hidden>Sign out</button>
    </header>
    <main id="content" aria-live="polite"><p>Connecting…</p></main>
    <div id="toast" role="alert" hidden></div>
    <dialog id="search-dialog" aria-label="Search">
      <div class="row">
        <input
          id="search-query"
          placeholder="Search tasks and comments"
          aria-label="Search query"
        /><button id="search-close" class="quiet">Close</button>
      </div>
      <label class="inline"><input id="search-all" type="checkbox" />All projects</label>
      <div id="search-results"></div>
    </dialog>
  </body>
</html>
