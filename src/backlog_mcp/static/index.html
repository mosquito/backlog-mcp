<!doctype html>
<html lang="en" data-endpoint="/mcp" data-starting>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Backlog</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/ui/static/app.css" />
    <link rel="stylesheet" href="/ui/static/markdown.css" />
    <link
      rel="stylesheet"
      href="/ui/static/vendor/highlight-light.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      href="/ui/static/vendor/highlight-dark.css"
      media="(prefers-color-scheme: dark)"
    />
    <script defer src="/ui/static/vendor/highlight.min.js"></script>
    <script type="module" src="/ui/static/app.js"></script>
  </head>
  <body>
    <header inert>
      <a class="brand" href="/ui/">Backlog<span class="brand-dot">.</span></a>
      <nav id="breadcrumbs" aria-label="Breadcrumb" hidden></nav>
      <nav id="section-switch" class="view-switch" aria-label="Sections" hidden>
        <a id="tasks-open" href="/ui/" class="button quiet">Tasks</a>
        <a id="memory-open" href="/ui/?view=memory" class="button quiet">Memory</a>
      </nav>
      <button id="search-open" class="quiet">Search <kbd>⌘ K</kbd></button
      ><a href="/ui/static/connect.html" class="button primary connect-agent">Connect agent</a
      ><span id="principal"></span><button id="logout" class="quiet" hidden>Sign out</button>
    </header>
    <main id="content" aria-live="polite" aria-busy="true">
      <section class="initial-loading" aria-label="Loading page">
        <p role="status">Loading Backlog…</p>
        <div class="initial-placeholder" aria-hidden="true">
          <div class="placeholder-title"></div>
          <div class="placeholder-line"></div>
          <div class="placeholder-panel"></div>
        </div>
      </section>
    </main>
    <footer class="mobile-footer">
      <a href="/ui/static/connect.html">Connect agent</a>
    </footer>
    <div id="page-loading" role="status" hidden>Loading…</div>
    <div id="toast" role="alert" hidden></div>
    <dialog id="search-dialog" aria-label="Search">
      <div class="row">
        <input id="search-query" placeholder="Search backlog" aria-label="Search query" /><button
          id="search-close"
          class="quiet"
        >
          Close
        </button>
      </div>
      <details class="search-help">
        <summary>query syntax</summary>
        <div class="search-help-content markdown" aria-live="polite"></div>
      </details>
      <fieldset class="search-kinds">
        <legend>Search in:</legend>
        <label class="inline"><input id="search-all" type="checkbox" />All projects</label>
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="tasks" checked />Tasks</label
        >
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="comments" checked />Comments</label
        >
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="memory" checked />Memory</label
        >
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="projects" checked />Projects</label
        >
      </fieldset>
      <details class="search-advanced">
        <summary>Filters</summary>
        <div class="search-options">
          <label
            >Task status<select id="search-status">
              <option value="">Any status</option>
              <option>todo</option>
              <option>doing</option>
              <option>blocked</option>
              <option>done</option>
              <option>cancelled</option>
              <option>deleted</option>
            </select></label
          >
          <label>Tag<input id="search-tag" placeholder="Any tag" /></label>
          <label
            >Computer scope<select id="search-scope">
              <option value="all">All computers</option>
              <option value="current">This computer</option>
              <option value="computer">By name</option>
            </select></label
          >
          <label id="search-computer-field" hidden
            >Computer<input id="search-computer" placeholder="Computer name"
          /></label>
          <label
            >Results per type<input
              id="search-limit"
              type="number"
              min="1"
              max="200"
              step="1"
              value="15"
              required
          /></label>
          <label
            >Minimum similarity<input
              id="search-score"
              type="number"
              min="-1"
              max="1"
              step="any"
              value="0.12"
              required
          /></label>
        </div>
        <p class="muted">
          Status applies only to tasks. Computer scope applies when All projects is selected.
        </p>
      </details>
      <div id="search-results"></div>
    </dialog>
  </body>
</html>
