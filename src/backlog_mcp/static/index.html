<!doctype html>
<html lang="en" data-endpoint="{{ENDPOINT}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Backlog</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/ui/static/app.css" />
    <link rel="stylesheet" href="/ui/static/markdown.css" />
    <link
      rel="stylesheet"
      href="/ui/static/vendor/highlight-light.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      href="/ui/static/vendor/highlight-dark.css"
      media="(prefers-color-scheme: dark)"
    />
    <script defer src="/ui/static/vendor/highlight.min.js"></script>
    <script type="module" src="/ui/static/app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/ui/">Backlog<span class="brand-dot">.</span></a
      ><nav id="breadcrumbs" aria-label="Breadcrumb" hidden></nav>
      <nav id="section-switch" class="view-switch" aria-label="Sections" hidden>
        <a id="tasks-open" href="/ui/" class="button quiet">Tasks</a>
        <a id="memory-open" href="/ui/?view=memory" class="button quiet">Memory</a>
      </nav>
      <button id="search-open" class="quiet">Search <kbd>⌘ K</kbd></button
      ><a href="/ui/static/connect.html" class="button primary connect-agent">Connect agent</a
      ><span id="principal"></span><button id="logout" class="quiet" hidden>Sign out</button>
    </header>
    <main id="content" aria-live="polite"><p>Connecting…</p></main>
    <footer class="mobile-footer">
      <a href="/ui/static/connect.html">Connect agent</a>
    </footer>
    <div id="toast" role="alert" hidden></div>
    <dialog id="search-dialog" aria-label="Search">
      <div class="row">
        <input id="search-query" placeholder="Search backlog" aria-label="Search query" /><button
          id="search-close"
          class="quiet"
        >
          Close
        </button>
      </div>
      <fieldset class="search-kinds">
        <legend>Search in:</legend>
        <label class="inline"><input id="search-all" type="checkbox" />All projects</label>
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="tasks" checked />Tasks</label
        >
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="comments" checked />Comments</label
        >
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="memory" checked />Memory</label
        >
        <label class="inline"
          ><input type="checkbox" name="search-kind" value="projects" checked />Projects</label
        >
      </fieldset>
      <div id="search-results"></div>
    </dialog>
  </body>
</html>
